# .github/ISSUE_TEMPLATE/bug_report.yml
name: 🐛 Bug Report
description: Report a bug in python-fawkes-path (FastAPI service, observability, pipeline)
title: "[Bug]: "
# Only labels that already exist in this repo are listed. uFawkesDevX's
# template also sets "needs-triage"; this repo has no such label.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g. /metrics returns 500 after the OTel exporter change
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Application code (app/)
        - Tests (tests/)
        - Observability (OTel traces, Prometheus metrics, logging)
        - Build / dependencies (pyproject.toml, requirements*.txt, Dockerfile)
        - CI / pipeline contract
        - Documentation (README, docs/)
      validations:
        required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      validations:
        required: true

  - type: input
    id: version
    attributes:
      label: Version / Tag / Commit SHA
      placeholder: 0.1.6 or bf4f0ea

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      render: shell
