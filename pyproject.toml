[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fawkes-path"
# Keep in step with `__version__` in app/__init__.py, which is the value the
# service actually reports at runtime (/info). app/__init__.py stays the
# runtime source because the Docker image never installs this package — it
# runs from the checked-out tree with `uvicorn app.main:app`.
# When release automation is enabled for this repo, configure release-please
# with `release-type: python` so it bumps this field and the changelog together.
version = "0.1.6"
description = "Minimal FastAPI service that validates the Fawkes platform pipeline end to end"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.40.0",
  "pydantic==2.13.4",
  "prometheus-client==0.25.0",
  "opentelemetry-sdk==1.43.0",
  "opentelemetry-instrumentation-fastapi==0.64b0",
  "opentelemetry-exporter-otlp-proto-grpc==1.43.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==5.0.0",
  "httpx2==2.12.0",
  "ruff==0.15.20",
  "black==26.5.1",
  "behave==1.3.3",
]

[project.urls]
Repository = "https://github.com/paruff/python-fawkes-path"
Issues = "https://github.com/paruff/python-fawkes-path/issues"

# requirements.txt / requirements-dev.txt remain the install path used by the
# Dockerfile and the README quick start. The dependency lists above mirror them
# exactly; when you change one, change the other.
[tool.setuptools]
packages = ["app"]
