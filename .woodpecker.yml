# Generated by scripts/generate_woodpecker_yml.py from .fawkespipe.yml
# Do not edit by hand — edit .fawkespipe.yml and run `make generate-pipeline`.
# CI should run `generate_woodpecker_yml.py --check` to gate on drift.

steps:
- name: build
  image: buildpacksio/pack:0.32.1-base
  environment:
    REGISTRY_USERNAME:
      from_secret: registry_username
    REGISTRY_PASSWORD:
      from_secret: registry_password
  commands:
  - mkdir -p "$HOME/.docker"
  - AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr
    -d '\n')
  - printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
  - pack build $REGISTRY_USERNAME/${CI_REPO_NAME}:${CI_COMMIT_SHA:0:7} --builder paketobuildpacks/builder:base
    --path . --publish
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  when:
    event:
    - push
    - manual
    branch: main
- name: notify-obs
  image: curlimages/curl:8.6.0
  environment:
    DORA_INGESTION_URL:
      from_secret: dora_ingestion_url
  commands:
  - '[ -n "$DORA_INGESTION_URL" ] || { echo "dora_ingestion_url secret is not set";
    exit 1; }'
  - DEPLOY_STATUS=success; [ "${CI_PIPELINE_STATUS:-success}" = "success" ] || DEPLOY_STATUS=failed
  - BODY=$(printf '{"schema_version":"1.0","event_type":"deployment","repo":"%s","service":"%s","environment":"production","commit_sha":"%s","deployed_at":"%s","status":"%s","pipeline_url":"%s"}'
    "$CI_REPO" "$CI_REPO_NAME" "$CI_COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$DEPLOY_STATUS"
    "$CI_PIPELINE_URL")
  - 'set -- -s -o /dev/null -w "%{http_code}" -X POST "$DORA_INGESTION_URL/event"
    -H "Content-Type: application/json"'
  - '[ -z "$DORA_API_KEY" ] || set -- "$@" -H "Authorization: Bearer $DORA_API_KEY"'
  - CODE=$(curl "$@" -d "$BODY")
  - echo "DORA event HTTP $CODE"
  - '[ "$CODE" = "201" ]'
  failure: ignore
  when:
    event:
    - push
    - manual
    branch: main
    status:
    - success
    - failure
